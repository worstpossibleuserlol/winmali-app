name: WinMali Android CI

on:
  push:
    branches:
      - main
      - beta
      - development
      - runtime-compatibility
      - gpu-compatibility
      - hotfix-system-files-extraction
    paths:
      - "**.gradle"
      - "**.java"
      - "**.kt"
      - "**.cpp"
      - "**.c"
      - "**.h"
      - "**.xml"
      - "gradle/**"
      - "app/src/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

concurrency:
  group: winmali-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the action's obsolete default "tools" package.
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 5 -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinMali-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK output and bundled system assets
        run: |
          APK=app/build/outputs/apk/debug/WinMali_2.0.1.apk
          test -s "$APK"
          file "$APK"

          unzip -p "$APK" assets/rootfs.tzst > "$RUNNER_TEMP/rootfs.tzst"
          test -s "$RUNNER_TEMP/rootfs.tzst"
          ROOTFS_MAGIC="$(od -An -tx1 -N4 "$RUNNER_TEMP/rootfs.tzst" | tr -d ' \\n')"
          test "$ROOTFS_MAGIC" = "28b52ffd"

          # Validate the complete compressed TAR stream on Linux. The Android
          # unit-test JVM cannot load the APK's Android-only zstd native library.
          sudo apt-get update
          sudo apt-get install -y zstd
          zstd -q -t "$RUNNER_TEMP/rootfs.tzst"
          zstd -q -d -c "$RUNNER_TEMP/rootfs.tzst" | tar -tf - > "$RUNNER_TEMP/rootfs.list"
          test -s "$RUNNER_TEMP/rootfs.list"
          grep -Eq '(^|/)opt/wine/bin/wine(64)?' "$RUNNER_TEMP/rootfs.list"
          grep -Eq '(^|/)opt/wine/lib/wine/x86_64-windows/' "$RUNNER_TEMP/rootfs.list"
          grep -Eq '(^|/)opt/wine/lib/wine/i386-windows/' "$RUNNER_TEMP/rootfs.list"

          # The bundled Wine is x86-64 and is launched through the bundled
          # AArch64 Box64 runtime. Verify both ELF architectures explicitly.
          sudo apt-get install -y binutils
          zstd -q -d -c "$RUNNER_TEMP/rootfs.tzst" | tar -xOf - ./opt/wine/bin/wine > "$RUNNER_TEMP/wine"
          test -s "$RUNNER_TEMP/wine"
          readelf -h "$RUNNER_TEMP/wine" | grep -q 'Machine:.*X86-64'

          unzip -p "$APK" assets/box64/box64-0.4.4.tzst > "$RUNNER_TEMP/box64.tzst"
          test -s "$RUNNER_TEMP/box64.tzst"
          zstd -q -t "$RUNNER_TEMP/box64.tzst"
          zstd -q -d -c "$RUNNER_TEMP/box64.tzst" | tar -xOf - ./usr/local/bin/box64 > "$RUNNER_TEMP/box64"
          test -s "$RUNNER_TEMP/box64"
          readelf -h "$RUNNER_TEMP/box64" | grep -q 'Machine:.*AArch64'

          # The built-in Windows file manager and its process wrapper must be
          # present in every APK so existing containers can repair their prefix.
          unzip -p "$APK" assets/rootfs_patches.tzst > "$RUNNER_TEMP/rootfs_patches.tzst"
          test -s "$RUNNER_TEMP/rootfs_patches.tzst"
          zstd -q -t "$RUNNER_TEMP/rootfs_patches.tzst"
          zstd -q -d -c "$RUNNER_TEMP/rootfs_patches.tzst" | tar -tf - > "$RUNNER_TEMP/rootfs_patches.list"
          grep -Fq "home/xuser/.wine/drive_c/windows/wfm.exe" "$RUNNER_TEMP/rootfs_patches.list"
          grep -Fq "home/xuser/.wine/drive_c/windows/winhandler.exe" "$RUNNER_TEMP/rootfs_patches.list"
          unzip -p "$APK" assets/container_pattern.tzst > "$RUNNER_TEMP/container_pattern.tzst"
          test -s "$RUNNER_TEMP/container_pattern.tzst"
          PATTERN_MAGIC="$(od -An -tx1 -N4 "$RUNNER_TEMP/container_pattern.tzst" | tr -d ' \\n')"
          test "$PATTERN_MAGIC" = "28b52ffd"

          unzip -p "$APK" assets/common_dlls.json > "$RUNNER_TEMP/common_dlls.json"
          test -s "$RUNNER_TEMP/common_dlls.json"
          python -m json.tool "$RUNNER_TEMP/common_dlls.json" > /dev/null

      - name: Upload WinMali 2.0.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: WinMali_2.0.1
          path: app/build/outputs/apk/debug/WinMali_2.0.1.apk
          if-no-files-found: error
          retention-days: 30
