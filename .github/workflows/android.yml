name: WinMali Android CI

on:
  push:
    branches:
      - main
    paths:
      - "**.gradle"
      - "**.java"
      - "**.kt"
      - "**.cpp"
      - "**.c"
      - "**.h"
      - "**.xml"
      - "gradle/**"
      - "app/src/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the action's obsolete default "tools" package.
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 5 -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinMali-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/WinMali_1.0.0.apk
          file app/build/outputs/apk/debug/WinMali_1.0.0.apk

      - name: Upload WinMali 1.0.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: WinMali_1.0.0
          path: app/build/outputs/apk/debug/WinMali_1.0.0.apk
          if-no-files-found: error
          retention-days: 30
