name: WinMali Android CI

on:
  push:
    branches:
      - main
    paths:
      - "**.gradle"
      - "**.java"
      - "**.kt"
      - "**.cpp"
      - "**.c"
      - "**.h"
      - "**.xml"
      - "gradle/**"
      - "app/src/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: winmali-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the action's obsolete default "tools" package.
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 5 -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Fetch pinned AIO Graphics Test 2.3.1 (x64)
        run: |
          mkdir -p app/src/main/assets/test_direct3d
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/The412Banner/AIO-Graphics-Test/releases/download/2.3.1/AIO-Graphics-Test-64bit.exe" \
            -o app/src/main/assets/test_direct3d/AIO-Graphics-Test-64bit.exe
          echo "7f005809a453916c77673f21d0ea709b0ef5a35a8631c072b3713fd4073c7c7e  app/src/main/assets/test_direct3d/AIO-Graphics-Test-64bit.exe" | sha256sum --check --strict
          curl --fail --location --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/The412Banner/AIO-Graphics-Test/50ec41e4484d44eb5c05969396c1091c1bd9a1b3/LICENSE" \
            -o app/src/main/assets/test_direct3d/LICENSE
          curl --fail --location --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/The412Banner/AIO-Graphics-Test/50ec41e4484d44eb5c05969396c1091c1bd9a1b3/CREDITS.md" \
            -o app/src/main/assets/test_direct3d/CREDITS.md
          test -s app/src/main/assets/test_direct3d/LICENSE
          test -s app/src/main/assets/test_direct3d/CREDITS.md

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinMali-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK output and bundled system assets
        run: |
          APK=app/build/outputs/apk/debug/WinMali_2.0.0.apk
          test -s "$APK"
          file "$APK"

          unzip -p "$APK" assets/rootfs.tzst > "$RUNNER_TEMP/rootfs.tzst"
          test -s "$RUNNER_TEMP/rootfs.tzst"
          ROOTFS_MAGIC="$(od -An -tx1 -N4 "$RUNNER_TEMP/rootfs.tzst" | tr -d ' \\n')"
          test "$ROOTFS_MAGIC" = "28b52ffd"

          unzip -p "$APK" assets/container_pattern.tzst > "$RUNNER_TEMP/container_pattern.tzst"
          test -s "$RUNNER_TEMP/container_pattern.tzst"
          PATTERN_MAGIC="$(od -An -tx1 -N4 "$RUNNER_TEMP/container_pattern.tzst" | tr -d ' \\n')"
          test "$PATTERN_MAGIC" = "28b52ffd"

          unzip -p "$APK" assets/test_direct3d/AIO-Graphics-Test-64bit.exe > "$RUNNER_TEMP/AIO-Graphics-Test-64bit.exe"
          test -s "$RUNNER_TEMP/AIO-Graphics-Test-64bit.exe"
          echo "7f005809a453916c77673f21d0ea709b0ef5a35a8631c072b3713fd4073c7c7e  $RUNNER_TEMP/AIO-Graphics-Test-64bit.exe" | sha256sum --check --strict
          file "$RUNNER_TEMP/AIO-Graphics-Test-64bit.exe" | grep -q "PE32+ executable.*x86-64"

          # AIO Graphics Test compiles src/app.ico into the EXE as RT_ICON (3)
          # and RT_GROUP_ICON (14). Verify the original upstream icon survived.
          objdump -x "$RUNNER_TEMP/AIO-Graphics-Test-64bit.exe" > "$RUNNER_TEMP/AIO-Graphics-Test-resources.txt"
          python - "$RUNNER_TEMP/AIO-Graphics-Test-resources.txt" <<'PY'
          import pathlib
          import re
          import sys

          output = pathlib.Path(sys.argv[1]).read_text()
          assert "The .rsrc Resource Directory section:" in output, "PE resource section is missing"
          resource_section = output.split("The .rsrc Resource Directory section:", 1)[1]
          root_type_ids = set(re.findall(r"(?m)^[0-9a-fA-F]{3}   Entry: ID: (0x[0-9a-fA-F]+)", resource_section))
          assert "0x000003" in root_type_ids, "AIO RT_ICON image resources are missing"
          assert "0x00000e" in root_type_ids, "AIO RT_GROUP_ICON resource is missing"
          PY

          unzip -p "$APK" assets/wine_startmenu.json > "$RUNNER_TEMP/wine_startmenu.json"
          python - "$RUNNER_TEMP/wine_startmenu.json" <<'PY'
          import json
          import pathlib
          import sys

          menu = json.loads(pathlib.Path(sys.argv[1]).read_text())
          system_tools = next(item for item in menu if item.get("name") == "System Tools")
          direct3d = next(item for item in system_tools["children"] if item.get("name") == "Test Direct3D")
          assert direct3d["path"] == "Z:/opt/apps/TestD3D.exe"
          assert direct3d.get("iconLocation") == direct3d["path"], "Test Direct3D shortcut must read its icon from the AIO executable"
          PY

          unzip -p "$APK" assets/test_direct3d/LICENSE > "$RUNNER_TEMP/AIO-Graphics-Test-LICENSE"
          unzip -p "$APK" assets/test_direct3d/CREDITS.md > "$RUNNER_TEMP/AIO-Graphics-Test-CREDITS.md"
          test -s "$RUNNER_TEMP/AIO-Graphics-Test-LICENSE"
          test -s "$RUNNER_TEMP/AIO-Graphics-Test-CREDITS.md"

          unzip -p "$APK" assets/common_dlls.json > "$RUNNER_TEMP/common_dlls.json"
          test -s "$RUNNER_TEMP/common_dlls.json"
          python -m json.tool "$RUNNER_TEMP/common_dlls.json" > /dev/null

          unzip -p "$APK" assets/epic_games_launcher.ico > "$RUNNER_TEMP/epic_games_launcher.ico"
          test -s "$RUNNER_TEMP/epic_games_launcher.ico"
          python - "$RUNNER_TEMP/epic_games_launcher.ico" <<'PY'
          import pathlib
          import struct
          import sys

          data = pathlib.Path(sys.argv[1]).read_bytes()
          assert len(data) >= 6, "ICO is truncated"
          reserved, image_type, count = struct.unpack_from("<HHH", data, 0)
          assert reserved == 0 and image_type == 1 and count >= 1, "Invalid ICO header or empty image list"
          directory_end = 6 + count * 16
          assert directory_end <= len(data), "ICO directory is truncated"
          for index in range(count):
              entry = struct.unpack_from("<BBBBHHII", data, 6 + index * 16)
              size, offset = entry[6], entry[7]
              assert size > 0 and offset >= directory_end and offset + size <= len(data), "Invalid ICO image entry"
          PY

      - name: Upload WinMali 2.0.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: WinMali_2.0.0
          path: app/build/outputs/apk/debug/WinMali_2.0.0.apk
          if-no-files-found: error
          retention-days: 30
