name: WinMali Android CI

on:
  push:
    branches:
      - main
    paths:
      - "**.gradle"
      - "**.java"
      - "**.kt"
      - "**.cpp"
      - "**.c"
      - "**.h"
      - "**.xml"
      - "gradle/**"
      - "app/src/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: winmali-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-direct3d-test:
    name: Build upstream Microsoft Direct3D 9 test
    runs-on: windows-latest
    steps:
      - name: Check out pinned Microsoft DirectX SDK samples
        uses: actions/checkout@v4
        with:
          repository: microsoft/DirectX-SDK-Samples
          ref: 07e3eaa10e7dd026ec9d95fe326db2d5c4227e1b
          path: directx-sdk-samples
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore DirectX SDK sample dependencies
        shell: pwsh
        run: |
          nuget restore "directx-sdk-samples/C++/Direct3D/EmptyProject/EmptyProject_2022.sln" -PackagesDirectory "directx-sdk-samples/C++/packages"
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }

      - name: Patch Direct3D 9 smoke test for Wine compatibility and diagnostics
        shell: pwsh
        run: |
          $sourcePath = "directx-sdk-samples/C++/Direct3D/EmptyProject/EmptyProject.cpp"
          if (-not (Test-Path $sourcePath)) { throw "Pinned upstream EmptyProject.cpp is missing" }

          $source = @'
          //--------------------------------------------------------------------------------------
          // WinMali Direct3D 9 smoke test, based on Microsoft's DirectX SDK EmptyProject.
          // Upstream source: https://github.com/microsoft/DirectX-SDK-Samples
          //--------------------------------------------------------------------------------------
          #include "DXUT.h"
          #include "resource.h"

          struct D3D9TestVertex
          {
              float x;
              float y;
              float z;
              float rhw;
              D3DCOLOR color;
          };

          static void LogD3D9Failure(const char* operation, HRESULT result)
          {
              char message[160];
              wsprintfA(message, "WinMali Test Direct3D: %s failed (HRESULT=0x%08lX)\n",
                  operation, (unsigned long)result);
              OutputDebugStringA(message);
          }

          // Do not require unrelated texture/post-pixel-shader blending features.
          // The smoke test only needs a D3D9 device and fixed-function triangle rendering.
          bool CALLBACK IsD3D9DeviceAcceptable(D3DCAPS9*, D3DFORMAT, D3DFORMAT,
                                               bool, void*)
          {
              return true;
          }

          bool CALLBACK ModifyDeviceSettings(DXUTDeviceSettings*, void*)
          {
              return true;
          }

          HRESULT CALLBACK OnD3D9CreateDevice(IDirect3DDevice9*,
              const D3DSURFACE_DESC*, void*)
          {
              return S_OK;
          }

          HRESULT CALLBACK OnD3D9ResetDevice(IDirect3DDevice9*,
              const D3DSURFACE_DESC*, void*)
          {
              return S_OK;
          }

          void CALLBACK OnFrameMove(double, float, void*)
          {
          }

          void CALLBACK OnD3D9FrameRender(IDirect3DDevice9* device,
              double, float, void*)
          {
              if (device == NULL)
              {
                  OutputDebugStringA("WinMali Test Direct3D: D3D9 device is null\n");
                  return;
              }

              HRESULT hr = device->Clear(0, NULL, D3DCLEAR_TARGET,
                  D3DCOLOR_XRGB(24, 32, 64), 1.0f, 0);
              if (FAILED(hr))
              {
                  LogD3D9Failure("Clear", hr);
                  return;
              }

              hr = device->BeginScene();
              if (FAILED(hr))
              {
                  LogD3D9Failure("BeginScene", hr);
                  return;
              }

              D3DVIEWPORT9 viewport = {};
              hr = device->GetViewport(&viewport);
              if (SUCCEEDED(hr) && viewport.Width > 0 && viewport.Height > 0)
              {
                  const float left = (float)viewport.X;
                  const float top = (float)viewport.Y;
                  const float width = (float)viewport.Width;
                  const float height = (float)viewport.Height;

                  D3D9TestVertex vertices[3] =
                  {
                      { left + width * 0.50f, top + height * 0.16f, 0.5f, 1.0f,
                          D3DCOLOR_ARGB(255, 255, 80, 80) },
                      { left + width * 0.20f, top + height * 0.82f, 0.5f, 1.0f,
                          D3DCOLOR_ARGB(255, 80, 255, 120) },
                      { left + width * 0.80f, top + height * 0.82f, 0.5f, 1.0f,
                          D3DCOLOR_ARGB(255, 80, 160, 255) }
                  };

                  hr = device->SetVertexShader(NULL);
                  if (SUCCEEDED(hr)) hr = device->SetPixelShader(NULL);
                  if (SUCCEEDED(hr)) hr = device->SetTexture(0, NULL);
                  if (SUCCEEDED(hr)) hr = device->SetRenderState(D3DRS_ZENABLE, FALSE);
                  if (SUCCEEDED(hr)) hr = device->SetRenderState(D3DRS_LIGHTING, FALSE);
                  if (SUCCEEDED(hr)) hr = device->SetRenderState(D3DRS_CULLMODE, D3DCULL_NONE);
                  if (SUCCEEDED(hr)) hr = device->SetRenderState(D3DRS_ALPHABLENDENABLE, FALSE);
                  if (SUCCEEDED(hr)) hr = device->SetFVF(D3DFVF_XYZRHW | D3DFVF_DIFFUSE);
                  if (SUCCEEDED(hr))
                  {
                      hr = device->DrawPrimitiveUP(D3DPT_TRIANGLELIST, 1,
                          vertices, sizeof(D3D9TestVertex));
                  }
              }
              else if (FAILED(hr))
              {
                  LogD3D9Failure("GetViewport", hr);
              }

              if (FAILED(hr)) LogD3D9Failure("Fixed-function triangle", hr);

              hr = device->EndScene();
              if (FAILED(hr)) LogD3D9Failure("EndScene", hr);
          }

          LRESULT CALLBACK MsgProc(HWND, UINT, WPARAM, LPARAM,
              bool*, void*)
          {
              return 0;
          }

          void CALLBACK OnD3D9LostDevice(void*)
          {
          }

          void CALLBACK OnD3D9DestroyDevice(void*)
          {
          }

          INT WINAPI wWinMain(HINSTANCE, HINSTANCE, LPWSTR, int)
          {
              DXUTSetCallbackD3D9DeviceAcceptable(IsD3D9DeviceAcceptable);
              DXUTSetCallbackD3D9DeviceCreated(OnD3D9CreateDevice);
              DXUTSetCallbackD3D9DeviceReset(OnD3D9ResetDevice);
              DXUTSetCallbackD3D9FrameRender(OnD3D9FrameRender);
              DXUTSetCallbackD3D9DeviceLost(OnD3D9LostDevice);
              DXUTSetCallbackD3D9DeviceDestroyed(OnD3D9DestroyDevice);
              DXUTSetCallbackDeviceChanging(ModifyDeviceSettings);
              DXUTSetCallbackMsgProc(MsgProc);
              DXUTSetCallbackFrameMove(OnFrameMove);

              HRESULT hr = DXUTInit(true, false);
              if (FAILED(hr))
              {
                  LogD3D9Failure("DXUTInit", hr);
                  return (INT)hr;
              }

              // This executable intentionally tests Direct3D 9, not DXUT's D3D10 path.
              DXUTSetD3DVersionSupport(true, false);
              DXUTSetHotkeyHandling(true, true, true);
              DXUTSetCursorSettings(true, true);

              hr = DXUTCreateWindow(L"WinMali Test Direct3D - Direct3D 9");
              if (FAILED(hr))
              {
                  LogD3D9Failure("DXUTCreateWindow", hr);
                  DXUTShutdown((INT)hr);
                  return (INT)hr;
              }

              hr = DXUTCreateDevice(true, 640, 480);
              if (FAILED(hr))
              {
                  LogD3D9Failure("DXUTCreateDevice", hr);
                  DXUTShutdown((INT)hr);
                  return (INT)hr;
              }

              hr = DXUTMainLoop();
              if (FAILED(hr)) LogD3D9Failure("DXUTMainLoop", hr);

              const INT exitCode = DXUTGetExitCode();
              DXUTShutdown(exitCode);
              return exitCode;
          }
          '@

          [System.IO.File]::WriteAllText($sourcePath, $source, [System.Text.UTF8Encoding]::new($false))
          $written = [System.IO.File]::ReadAllText($sourcePath)
          $required = @(
            "DXUTSetD3DVersionSupport(true, false)",
            "D3DCOLOR_XRGB(24, 32, 64)",
            "DrawPrimitiveUP(D3DPT_TRIANGLELIST, 1",
            "LogD3D9Failure",
            "DXUTCreateDevice(true, 640, 480)"
          )
          foreach ($marker in $required) {
            if (-not $written.Contains($marker)) { throw "Direct3D smoke-test patch is incomplete: $marker" }
          }
          if ($written.Contains("D3DCOLOR_ARGB(0, 45, 50, 170)")) {
            throw "The transparent alpha-zero clear colour is still present"
          }
          Write-Host "Patched D3D9 test: compatibility-first device selection, opaque clear, visible triangle and failure diagnostics"

      - name: Configure static C runtime for the upstream sample
        shell: pwsh
        run: |
          $project = "directx-sdk-samples/C++/Direct3D/EmptyProject/EmptyProject_2022.vcxproj"
          $xml = [System.IO.File]::ReadAllText($project)
          $dynamicRuntime = "<RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>"
          $staticRuntime = "<RuntimeLibrary>MultiThreaded</RuntimeLibrary>"
          $matches = ([regex]::Matches($xml, [regex]::Escape($dynamicRuntime))).Count
          if ($matches -lt 1) { throw "Expected MSVC dynamic runtime settings were not found in the pinned sample project" }
          $xml = $xml.Replace($dynamicRuntime, $staticRuntime)
          [System.IO.File]::WriteAllText($project, $xml, [System.Text.UTF8Encoding]::new($false))
          if ($xml.Contains($dynamicRuntime)) { throw "Failed to switch the sample project to the static C runtime" }
          Write-Host "Changed $matches upstream project runtime configurations to static CRT for the Release build"

      - name: Build Direct3D 9 EmptyProject x64
        shell: pwsh
        run: |
          msbuild "directx-sdk-samples/C++/Direct3D/EmptyProject/EmptyProject_2022.sln" /m /verbosity:minimal /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Direct3D 9 sample build failed" }

      - name: Package and validate upstream test executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $built = Get-ChildItem "directx-sdk-samples/C++/Direct3D/EmptyProject" -Filter "EmptyProject.exe" -Recurse |
            Where-Object { $_.FullName -match "[\\/]x64[\\/]Release[\\/]" } |
            Select-Object -First 1
          if (-not $built) { throw "Built x64 Release EmptyProject.exe was not found" }

          $output = Join-Path $env:GITHUB_WORKSPACE "direct3d-test-artifact"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $exe = Join-Path $output "TestD3D.exe"
          Copy-Item $built.FullName $exe -Force

          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 256 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "TestD3D.exe is not a valid PE executable"
          }
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 64 -or $peOffset + 6 -gt $bytes.Length) {
            throw "PE header offset is invalid"
          }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) {
            throw "PE signature is missing"
          }
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Expected x86-64 (0x8664), got 0x{0:X4}" -f $machine)
          }

          $item = Get-Item $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            file = "TestD3D.exe"
            size = [long]$item.Length
            sha256 = $hash
            architecture = "x86_64"
            api = "Direct3D 9"
            sourceRepository = "microsoft/DirectX-SDK-Samples"
            sourceCommit = "07e3eaa10e7dd026ec9d95fe326db2d5c4227e1b"
            sourcePath = "C++/Direct3D/EmptyProject"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $output "manifest.json"),
            ($manifest | ConvertTo-Json -Depth 4),
            [System.Text.UTF8Encoding]::new($false)
          )
          Copy-Item "directx-sdk-samples/LICENSE" (Join-Path $output "LICENSE") -Force

          $credits = @"
          # Test Direct3D

          This executable is built from Microsoft's upstream DirectX SDK EmptyProject sample.

          - Source: https://github.com/microsoft/DirectX-SDK-Samples
          - Pinned source commit: 07e3eaa10e7dd026ec9d95fe326db2d5c4227e1b
          - Source directory: C++/Direct3D/EmptyProject
          - API: Direct3D 9
          - Architecture: x86-64

          The sample creates a Direct3D 9 device, clears the backbuffer to an opaque blue, renders a coloured fixed-function triangle, and logs HRESULT failures to the guest debug output. WinMali applies a small documented compatibility patch to Microsoft's sample before building.
          Its original icon is compiled from Microsoft's C++/DXUT/Optional/directx.ico through EmptyProject.rc.
          The source repository is distributed under the MIT License; see LICENSE.
          "@
          [System.IO.File]::WriteAllText(
            (Join-Path $output "CREDITS.md"),
            $credits,
            [System.Text.UTF8Encoding]::new($false)
          )

          if ((Get-Item (Join-Path $output "LICENSE")).Length -eq 0) { throw "MIT license file is missing" }
          if ((Get-Item (Join-Path $output "CREDITS.md")).Length -eq 0) { throw "Credits file is missing" }
          Write-Host "Packaged $($item.Length) bytes; SHA-256 $hash"

      - name: Upload Direct3D 9 test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Microsoft-Direct3D9-Test
          path: direct3d-test-artifact/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build and test Android app
    needs: build-direct3d-test
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Microsoft Direct3D 9 test
        uses: actions/download-artifact@v4
        with:
          name: Microsoft-Direct3D9-Test
          path: app/src/main/assets/test_direct3d

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the action's obsolete default "tools" package.
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 5 -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK output and bundled system assets
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/WinMali_2.0.0.apk
          test -s "$APK"
          file "$APK"

          unzip -p "$APK" assets/rootfs.tzst > "$RUNNER_TEMP/rootfs.tzst"
          test -s "$RUNNER_TEMP/rootfs.tzst"
          ROOTFS_MAGIC="$(od -An -tx1 -N4 "$RUNNER_TEMP/rootfs.tzst" | tr -d ' \\n')"
          test "$ROOTFS_MAGIC" = "28b52ffd"

          unzip -p "$APK" assets/container_pattern.tzst > "$RUNNER_TEMP/container_pattern.tzst"
          test -s "$RUNNER_TEMP/container_pattern.tzst"
          PATTERN_MAGIC="$(od -An -tx1 -N4 "$RUNNER_TEMP/container_pattern.tzst" | tr -d ' \\n')"
          test "$PATTERN_MAGIC" = "28b52ffd"

          unzip -p "$APK" assets/test_direct3d/TestD3D.exe > "$RUNNER_TEMP/TestD3D.exe"
          unzip -p "$APK" assets/test_direct3d/manifest.json > "$RUNNER_TEMP/direct3d-manifest.json"
          unzip -p "$APK" assets/test_direct3d/LICENSE > "$RUNNER_TEMP/Microsoft-DirectX-SDK-LICENSE"
          unzip -p "$APK" assets/test_direct3d/CREDITS.md > "$RUNNER_TEMP/Microsoft-DirectX-SDK-CREDITS.md"
          test -s "$RUNNER_TEMP/TestD3D.exe"
          test -s "$RUNNER_TEMP/Microsoft-DirectX-SDK-LICENSE"
          test -s "$RUNNER_TEMP/Microsoft-DirectX-SDK-CREDITS.md"

          python - "$RUNNER_TEMP/TestD3D.exe" "$RUNNER_TEMP/direct3d-manifest.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import struct
          import sys

          executable = pathlib.Path(sys.argv[1])
          manifest = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          data = executable.read_bytes()
          assert len(data) >= 256 and data[:2] == b"MZ", "TestD3D.exe is not a PE executable"
          pe_offset = struct.unpack_from("<I", data, 0x3C)[0]
          assert data[pe_offset:pe_offset + 4] == b"PE\0\0", "PE signature is missing"
          machine = struct.unpack_from("<H", data, pe_offset + 4)[0]
          assert machine == 0x8664, f"Expected x86-64 PE, got 0x{machine:04x}"
          assert manifest["file"] == "TestD3D.exe"
          assert manifest["architecture"] == "x86_64"
          assert manifest["api"] == "Direct3D 9"
          assert manifest["sourceRepository"] == "microsoft/DirectX-SDK-Samples"
          assert manifest["sourceCommit"] == "07e3eaa10e7dd026ec9d95fe326db2d5c4227e1b"
          assert manifest["size"] == len(data), "Manifest size does not match the executable"
          digest = hashlib.sha256(data).hexdigest()
          assert manifest["sha256"] == digest, "Manifest SHA-256 does not match the executable"
          print(f"Verified Microsoft D3D9 test: {len(data)} bytes, SHA-256 {digest}")
          PY

          # Confirm the test has no external Visual C++ runtime dependency.
          objdump -p "$RUNNER_TEMP/TestD3D.exe" > "$RUNNER_TEMP/TestD3D-imports.txt"
          if grep -Eiq 'DLL Name: (VCRUNTIME|MSVCP|api-ms-win-crt)' "$RUNNER_TEMP/TestD3D-imports.txt"; then
            cat "$RUNNER_TEMP/TestD3D-imports.txt"
            echo "Direct3D test still depends on a redistributable Visual C++ runtime" >&2
            exit 1
          fi

          # Microsoft EmptyProject.rc embeds the upstream DirectX icon in the EXE.
          objdump -x "$RUNNER_TEMP/TestD3D.exe" > "$RUNNER_TEMP/TestD3D-resources.txt"
          python - "$RUNNER_TEMP/TestD3D-resources.txt" <<'PY'
          import pathlib
          import re
          import sys

          output = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          assert "The .rsrc Resource Directory section:" in output, "PE resource section is missing"
          section = output.split("The .rsrc Resource Directory section:", 1)[1]
          ids = set(re.findall(r"(?m)^\s*[0-9a-fA-F]+\s+Entry: ID: (0x[0-9a-fA-F]+)", section))
          assert "0x000003" in ids, "Original Microsoft RT_ICON resources are missing"
          assert "0x00000e" in ids, "Original Microsoft RT_GROUP_ICON resource is missing"
          PY

          unzip -p "$APK" assets/wine_startmenu.json > "$RUNNER_TEMP/wine_startmenu.json"
          python - "$RUNNER_TEMP/wine_startmenu.json" <<'PY'
          import json
          import pathlib
          import sys

          menu = json.loads(pathlib.Path(sys.argv[1]).read_text())
          system_tools = next(item for item in menu if item.get("name") == "System Tools")
          direct3d = next(item for item in system_tools["children"] if item.get("name") == "Test Direct3D")
          assert direct3d["path"] == "Z:/opt/apps/TestD3D.exe"
          assert direct3d.get("iconLocation") == direct3d["path"], "Test Direct3D shortcut must read the original icon embedded in TestD3D.exe"
          PY

          unzip -p "$APK" assets/common_dlls.json > "$RUNNER_TEMP/common_dlls.json"
          test -s "$RUNNER_TEMP/common_dlls.json"
          python -m json.tool "$RUNNER_TEMP/common_dlls.json" > /dev/null

          unzip -p "$APK" assets/epic_games_launcher.ico > "$RUNNER_TEMP/epic_games_launcher.ico"
          test -s "$RUNNER_TEMP/epic_games_launcher.ico"
          python - "$RUNNER_TEMP/epic_games_launcher.ico" <<'PY'
          import pathlib
          import struct
          import sys

          data = pathlib.Path(sys.argv[1]).read_bytes()
          assert len(data) >= 6, "ICO is truncated"
          reserved, image_type, count = struct.unpack_from("<HHH", data, 0)
          assert reserved == 0 and image_type == 1 and count >= 1, "Invalid ICO header or empty image list"
          directory_end = 6 + count * 16
          assert directory_end <= len(data), "ICO directory is truncated"
          for index in range(count):
              entry = struct.unpack_from("<BBBBHHII", data, 6 + index * 16)
              size, offset = entry[6], entry[7]
              assert size > 0 and offset >= directory_end and offset + size <= len(data), "Invalid ICO image entry"
          PY

      - name: Upload WinMali 2.0.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: WinMali_2.0.0
          path: app/build/outputs/apk/debug/WinMali_2.0.0.apk
          if-no-files-found: error
          retention-days: 30
